<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><!-- remove once bookings go live -->
<title>Konstitucijos 9, biuras 16 aukšte</title>
<meta name="description" content="Darbo vieta, visas biuras valandai ir renginiai 16 aukšte, Konstitucijos pr. 9, Vilnius. Rezervuok laiką internetu.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --ink:#161616; --ink2:#5c5c5c; --ink3:#737373;
  --line:#e6e6e3; --line2:#d4d4d0; --soft:#f5f5f3; --soft2:#e6e6e1;
  --hl:#ff9ad2; --pink:#c8006e; --pink2:#a8005c; --green:#10a050;
  --r:18px;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 6px 18px rgba(0,0,0,.11);
  --gut:clamp(16px,4vw,40px);
  --ease:cubic-bezier(.16,1,.3,1);
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:96px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
html,body{overflow-x:clip}
body{margin:0;background:#fff;color:var(--ink);font:400 16px/1.55 var(--ui);-webkit-font-smoothing:antialiased;caret-color:var(--pink)}
::selection{background:var(--hl);color:var(--ink)}
img{display:block;max-width:100%}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--gut)}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.disp{font-family:var(--display);font-stretch:125%;font-weight:850;text-transform:uppercase;letter-spacing:-.012em;line-height:.9}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid transparent;transition:border-color .2s}
.top.solid{border-color:var(--line)}
.top .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:80px;gap:16px}
.brand{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:19px;text-transform:uppercase;text-decoration:none;letter-spacing:-.01em;white-space:nowrap;justify-self:start}
.tabs{display:flex;gap:30px}
.tabs a{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:600;font-size:15px;color:var(--ink2);padding:12px 2px 10px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
.tabs .icon{width:20px;height:20px}
.right{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.lang{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- buttons ---------- */
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--pink);color:#fff;font-weight:600;font-size:16px;height:50px;padding:0 26px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,transform .15s var(--ease)}
.cta:hover{background:var(--pink2)}
.cta:active{transform:scale(.97)}
.cta:disabled{opacity:.6;cursor:default}
.cta.small{height:40px;padding:0 18px;font-size:15px}
.cta.block{width:100%}
.cta .icon{width:18px;height:18px;stroke-width:2}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .15s}
.ghost:hover{background:var(--soft)}

/* ---------- hero ---------- */
.hero{padding:40px 0 28px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;align-items:end;gap:28px 56px}
.hero h1{margin:0;font-size:clamp(46px,7.8vw,96px);text-wrap:balance}
.sticker{display:inline-flex;align-items:center;gap:10px;margin-top:22px;background:var(--hl);color:var(--ink);font-family:var(--display);font-stretch:112%;font-weight:800;text-transform:uppercase;font-size:clamp(14px,1.5vw,18px);line-height:1.1;padding:9px 16px 8px;transform:rotate(-2.5deg);transform-origin:left center;animation:slap .8s var(--ease) .2s both}
@keyframes slap{from{transform:rotate(-10deg) scale(1.22)}to{transform:rotate(-2.5deg) scale(1)}}
.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px #fff;flex:none}
.hero-sub{font-family:var(--display);font-stretch:100%;font-weight:700;text-transform:uppercase;font-size:18px;line-height:1.25;margin:0 0 18px;letter-spacing:.005em;text-wrap:balance}
.hero-sub .side-f{display:block;margin-top:8px;font-weight:500;font-size:15px;color:var(--ink2)}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- gallery ---------- */
.gwrap{position:relative}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;height:clamp(340px,36vw,480px);border-radius:var(--r);overflow:hidden}
.gallery figure{margin:0;overflow:hidden;background:var(--soft)}
.gallery figure:first-child{grid-row:1/3}
.gallery img{width:100%;height:100%;object-fit:cover}
.gcount{display:none}
.gallery figure{cursor:zoom-in}
.g-all{position:absolute;right:calc(var(--gut) + 16px);bottom:16px;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--ink);background:#fff;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.14);transition:background .15s}
.g-all:hover{background:var(--soft)}
.g-all .icon{width:16px;height:16px;stroke-width:1.8}
html.locked{overflow:hidden}
dialog.tour{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#fff;color:var(--ink);overflow-y:auto;overscroll-behavior:contain}
dialog.tour::backdrop{background:#fff}
.tour-top{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line)}
.tour-top .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.tour-top h2{font-family:var(--display);font-stretch:112%;font-weight:800;text-transform:uppercase;font-size:22px;margin:0}
.tour-top .iconbtn{width:40px;height:40px}
.tour-list{max-width:980px;margin:0 auto;padding:28px var(--gut) 72px;display:grid;grid-template-columns:1fr 1fr;gap:22px 10px}
.tour-list figure{margin:0;scroll-margin-top:84px}
.tour-list figure.wide{grid-column:1/-1}
.tour-list img{display:block;width:100%;height:auto;border-radius:12px;background:var(--soft)}
.tour-list figcaption{font-size:14px;color:var(--ink2);margin-top:8px}

/* ---------- listing ---------- */
.listing{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:0 72px;padding-top:44px;padding-bottom:16px}
.main{min-width:0}
.main > section{padding:34px 0;border-bottom:1px solid var(--line)}
.main > section:first-child{padding-top:0}
.main > section:last-child{border-bottom:0}
.h2{font-family:var(--display);font-stretch:112%;font-weight:800;text-transform:uppercase;font-size:clamp(26px,2.6vw,36px);line-height:1.05;letter-spacing:-.005em;margin:0 0 22px;text-wrap:balance}
.intro .h2{font-size:clamp(28px,3vw,40px);margin-bottom:10px}
.meta{margin:0;color:var(--ink2);font-size:17px}
.host{display:flex;gap:20px;align-items:flex-start}
.host-head{width:76px;height:auto;flex:none}
.li-link{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.li-logo{width:18px;height:18px;flex:none}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-stretch:125%;font-size:21px;flex:none}
.host b{display:block;font-size:17px;font-weight:600}
.host p{margin:3px 0 0;color:var(--ink2);max-width:60ch}
.hl{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:22px}
.hl li{display:grid;grid-template-columns:26px 1fr;gap:18px;align-items:start}
.hl .icon{width:26px;height:26px;margin-top:1px}
.hl b{display:block;font-weight:600}
.hl p{margin:2px 0 0;color:var(--ink2)}

.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.offer{display:flex;flex-direction:column;text-decoration:none;color:inherit}
.offer .ph{border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--soft)}
.offer img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.offer:hover img{transform:scale(1.04)}
.o-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:12px}
.offer h3{font-size:16px;font-weight:600;margin:0;line-height:1.3}
.o-price{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.o-price small{font-weight:500;color:var(--ink2);font-size:14px}
.offer p{color:var(--ink2);margin:4px 0 0;font-size:15px;line-height:1.45}
.o-go{margin-top:auto;padding-top:10px;font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}

.host{margin-top:30px}
.am-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 40px}
.am-group h3{font-size:16px;font-weight:700;margin:0 0 14px}
.am{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.am li{display:flex;gap:14px;align-items:flex-start;line-height:1.4}

/* floor plan */
.plan-wrap{overflow-x:auto;scrollbar-width:none}
.plan-wrap::-webkit-scrollbar{display:none}
.plan{position:relative;aspect-ratio:1.6;min-width:480px;border:2px solid var(--ink);border-radius:14px;background:#fff;overflow:hidden}
.p-win{position:absolute;left:0;right:0;top:0;height:9px;background:repeating-linear-gradient(90deg,#d6dfe5 0 26px,#fff 26px 28px);border-bottom:1px solid #c4cdd3;z-index:2}
.p-room{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:var(--soft);font-size:12.5px;font-weight:600;color:var(--ink2);padding:6px;line-height:1.2}
.p-room .icon{width:20px;height:20px}
.p-room.glass{background:#f6f8f9;border-right:1.5px dashed var(--ink3);border-bottom:1.5px dashed var(--ink3)}
.p-door{position:absolute;bottom:-2px;height:4px;background:#fff;z-index:2}
.p-door::before{content:'';position:absolute;left:0;bottom:4px;width:100%;aspect-ratio:1;border-top-right-radius:100%;border-top:1.5px solid var(--ink3);border-right:1.5px solid var(--ink3)}
.p-label{position:absolute;font-size:11.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.p-chair{position:absolute;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--line2);background:#fff}
.p-sofa{position:absolute;left:12%;right:12%;bottom:9%;height:24%;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--ink3);background:#fff}
.p-counter{position:absolute;right:0;top:0;bottom:0;width:20%;background:#e9e9e4;border-left:1.5px solid var(--ink3)}
.p-room > .icon,.p-room > span{position:relative;z-index:1}
.p-room.has-sofa{justify-content:flex-start;padding-top:18px}
.p-room.has-counter{padding-right:6.5%}
.p-desk{position:absolute;border:0;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;padding:0;line-height:1.1;z-index:1}
.p-desk b{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:18px}
.p-desk span{font-size:11.5px;font-weight:600}
.p-desk.free{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);cursor:pointer;transition:background .15s}
.p-desk.free::after{content:'';position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.p-desk.free:hover{background:var(--soft)}
.p-desk.mine{background:var(--ink);color:#fff;cursor:pointer}
.p-desk.taken{background:repeating-linear-gradient(135deg,#dededa 0 4px,#f2f2ef 4px 8px);color:var(--ink2)}
.plan-legend{margin:14px 0 0}
.sw.pfree{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink)}
.sw.win{background:repeating-linear-gradient(90deg,#d6dfe5 0 5px,#fff 5px 6px);box-shadow:inset 0 0 0 1px #c4cdd3}

.dayrow{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;align-items:start;margin-bottom:14px}
.dayrow > span{font-weight:600;font-size:15px;padding-top:10px}
.track24{position:relative;height:42px;background:#fbfbfa;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;overflow:hidden}
.seg{position:absolute;top:5px;bottom:5px;display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;border-radius:8px}
.seg.desk{background:var(--soft2);color:var(--ink2)}
.seg.room{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.sw.room{background:#fff;box-shadow:inset 0 0 0 1.5px var(--ink)}
.db-legend{margin-bottom:14px}
.ticks{position:relative;height:20px;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;top:5px;transform:translateX(-50%)}
.ticks span:first-child{transform:none}
.ticks span:last-child{transform:translateX(-100%)}

/* ---------- calendar ---------- */
.lead{color:var(--ink2);margin:-12px 0 20px;max-width:60ch}
.book-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.seg-ctl{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px}
.seg-ctl button{border:0;background:none;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink2);transition:background .15s,color .15s,box-shadow .15s}
.seg-ctl button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.14)}
.weeknav{display:flex;align-items:center;gap:8px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0;transition:border-color .15s}
.iconbtn .icon{width:16px;height:16px;stroke-width:2}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn:not(:disabled):hover{border-color:var(--ink)}
.lbl{font-weight:600;min-width:128px;text-align:center;font-variant-numeric:tabular-nums}
.legend{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink2)}
.legend li{display:flex;align-items:center;gap:7px}
.sw{width:14px;height:14px;border-radius:4px}
.sw.free{background:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
.sw.taken{background:repeating-linear-gradient(135deg,#dededa 0 3px,#f2f2ef 3px 6px)}
.sw.desk{background:var(--soft2)}
.sw.sel{background:var(--ink)}
.gridwrap{position:relative}
.grid{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:3px 4px}
.dh{text-align:center;font-size:12px;color:var(--ink2);padding-bottom:6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.dh b{font-size:15px;color:var(--ink);font-weight:600;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
.dh.today b{box-shadow:inset 0 0 0 1.5px var(--ink)}
.tl{font-size:11px;color:var(--ink3);text-align:right;padding-right:6px;line-height:30px;font-variant-numeric:tabular-nums}
.cell{appearance:none;height:30px;border-radius:8px;border:0;padding:0 7px;font-size:12px;font-weight:600;text-align:left;display:flex;align-items:center;white-space:nowrap;overflow:hidden;min-width:0;background:transparent;line-height:1.1}
.cell.past{background:#fafaf8}
.cell.free{background:#fff;box-shadow:inset 0 0 0 1px var(--line2);cursor:pointer;color:var(--ink3);font-weight:500;transition:box-shadow .12s,color .12s}
.cell.free::after{content:attr(data-t);font-variant-numeric:tabular-nums}
.cell.free:hover{box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink)}
.cell.taken{background:repeating-linear-gradient(135deg,#dededa 0 4px,#f2f2ef 4px 8px);color:var(--ink2)}
.cell.desk{background:var(--soft2);color:var(--ink2)}
.cell.sel{background:var(--ink);color:#fff;box-shadow:none}
.cell.sel::after{content:none}
.cell.run{border-radius:0;margin-top:-3px;height:33px}
.cell.run.first{border-top-left-radius:8px;border-top-right-radius:8px;margin-top:0;height:30px;white-space:normal;align-items:flex-start;padding-top:6px}
.cell.run.last{border-bottom-left-radius:8px;border-bottom-right-radius:8px}
.cell.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.days,.slots{display:none}
.loading{position:absolute;inset:0;background:rgba(255,255,255,.78);display:grid;place-items:center;font-weight:600;color:var(--ink2);border-radius:12px}

/* ---------- booking card ---------- */
.side{position:relative}
.card{position:sticky;top:104px;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;background:#fff}
.c-price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.c-price b{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.c-price span{color:var(--ink2)}
.c-sub{margin:2px 0 18px;color:var(--ink2);font-size:14px}
.boxes{border:1px solid var(--line2);border-radius:12px;display:grid;grid-template-columns:1fr 1fr;margin-bottom:14px;overflow:hidden}
.box{padding:10px 14px 11px;min-width:0}
.box + .box{border-left:1px solid var(--line2)}
.box.wide{grid-column:1/-1;border-left:0;border-top:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;padding-top:8px;padding-bottom:8px}
.box small{display:block;font-size:12px;font-weight:700;color:var(--ink)}
.box .v{display:block;font-size:15px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.box .v.on{color:var(--ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper output{min-width:50px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.stepper .iconbtn{width:32px;height:32px}
fieldset{border:0;margin:0 0 14px;padding:0;min-width:0}
.fl{font-size:12px;font-weight:700;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0;width:100%;height:100%}
.chips label > span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:#fff;transition:background .15s,border-color .15s,color .15s}
.chips label:hover > span{border-color:var(--ink)}
.chips .icon{width:16px;height:16px}
.chips input:checked + span{background:var(--ink);border-color:var(--ink);color:#fff}
.chips input:focus-visible + span{outline:2px solid var(--ink);outline-offset:2px}
.fields{display:grid;gap:8px;margin-bottom:14px}
.fields .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field input{width:100%;height:48px;border:1px solid var(--line2);border-radius:12px;padding:0 14px;font-size:16px;background:#fff;transition:border-color .15s,box-shadow .15s}
.field input::placeholder{color:#767676}
.field input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.field input[aria-invalid="true"]{border-color:var(--pink2);box-shadow:0 0 0 1px var(--pink2)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.p-err{color:#b0105a;font-size:14px;font-weight:600;margin:0 0 10px}
.p-err:empty{display:none}
.c-note{text-align:center;font-size:14px;color:var(--ink2);margin:12px 0 0}
.lines{margin:16px 0 0}
.lines div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;color:var(--ink2);font-variant-numeric:tabular-nums}
.lines .tot{border-top:1px solid var(--line);margin-top:12px;padding-top:16px;color:var(--ink);font-weight:700}

/* ---------- events ---------- */
.events{padding:72px 0 76px;border-top:1px solid var(--line)}
.ev-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 56px;align-items:end;margin-bottom:30px}
.mega{font-size:clamp(46px,8.4vw,96px);margin:0}
.ev-head p{max-width:46ch;color:var(--ink2);margin:0 0 6px;font-size:17px}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{position:relative;display:block;cursor:pointer}
.tile input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%;z-index:1}
.tile > span{display:flex;align-items:center;gap:14px;border:1.5px solid var(--ink);border-radius:999px;padding:14px 18px 14px 22px;background:#fff;transition:background .18s,color .18s}
.tile:hover > span{background:var(--soft)}
.tile input:checked + span{background:var(--ink);color:#fff}
.tile input:focus-visible + span{outline:2px solid var(--ink);outline-offset:3px}
.tile > span > .icon{width:28px;height:28px}
.t-check{width:28px;height:28px;margin-left:auto;flex:none;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center}
.t-check .icon{width:16px;height:16px;stroke-width:2.6;opacity:0}
.tile input:checked + span .t-check{background:#fff;border-color:#fff;color:var(--ink)}
.tile input:checked + span .t-check .icon{opacity:1}
.t-name{display:block;font-size:clamp(22px,2.4vw,30px);line-height:1}
.ev-row{display:flex;gap:10px;margin-top:14px;max-width:600px}

.ev-ok{font-weight:600;margin:14px 0 0}

.where{padding:64px 0 76px;border-top:1px solid var(--line)}
.map{border-radius:var(--r);overflow:hidden;height:420px;background:var(--soft)}

.w-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:20px}
.addr{display:flex;gap:10px;align-items:center;font-weight:600;font-size:17px;margin:0}
.w-row p:not(.addr){margin:4px 0 0 32px;color:var(--ink2)}

footer{background:var(--ink);color:#fff;padding:56px 0 30px;overflow:hidden}
.word{font-size:min(calc((100vw - 2 * var(--gut)) / 11.9),94px);line-height:.86;white-space:nowrap}
.f-row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:30px;font-size:14px;color:#b5b5b5}

.mbar{display:none}

  .slots{display:grid;gap:6px}

  .slot.taken{background:repeating-linear-gradient(135deg,#dededa 0 4px,#f2f2ef 4px 8px);color:var(--ink2);box-shadow:none;cursor:default}
  .slot.desk{background:var(--soft2);color:var(--ink2);box-shadow:none;cursor:default}
  .empty-day{color:var(--ink2);padding:12px 0;margin:0}

@media (max-width:743px){

  renderPurpose(); renderDaybars(); renderPlan(); renderLegend(); render();
}

/* ---------- day bars ---------- */
function renderDaybars() {
  // desks are open 24/7; the outlined windows are when the whole room can be booked
  const pct = h => (h / 24 * 100).toFixed(3) + '%';
  const seg = (cls, [a, b], label) => `<div class="seg ${cls}" style="left:${pct(a)};width:${pct(b - a)}">${label}</div>`;
  const ticks = '<div class="ticks">' + [0, 6, 12, 18, 24].map(h => `<span style="left:${pct(h)}">${pad(h)}:00</span>`).join('') + '</div>';
  const row = (label, win) => `<div class="dayrow"><span>${label}</span><div><div class="track24">${seg('desk', [0, 24], t('seg_desk'))}${seg('room', win, pad(win[0]) + '-' + pad(win[1]))}</div>${ticks}</div></div>`;
  $('daybars').innerHTML =
    `<ul class="legend db-legend"><li><span class="sw desk"></span>${t('seg_desk')}</li><li><span class="sw room"></span>${t('seg_room')}</li></ul>` +
    row(t('when_weekday'), CONFIG.ROOM_HOURS.weekday) + row(t('when_weekend'), CONFIG.ROOM_HOURS.weekend);
}

/* ---------- floor plan ---------- */
function renderPlan() {
  const P = CONFIG.PLAN;
  const box = o => `left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%`;
  let h = '<div class="p-win"></div>';
  h += P.rooms.map(r => `<div class="p-room${r.glass ? ' glass' : ''}${r.furniture ? ' has-' + r.furniture : ''}" style="${box(r)}">${r.furniture ? `<i class="p-${r.furniture}"></i>` : ''}<svg class="icon"><use href="#${r.icon}"/></svg><span>${t(r.key)}</span></div>`).join('');
  h += `<div class="p-door" style="left:${P.door.x}%;width:${P.door.w}%"></div><span class="p-label" style="left:${P.door.x + P.door.w + 1}%;bottom:3%">${t('plan_door')}</span>`;
  h += P.desks.map(d => `<span class="p-chair" style="left:${d.x + P.desk.w / 2 - 2.5}%;top:${d.y + P.desk.h + 2}%;width:5%;height:8%"></span>`).join('');
  h += P.desks.map(d => {
    const style = box({ x: d.x, y: d.y, w: P.desk.w, h: P.desk.h });
    if (d.taken) return `<div class="p-desk taken" style="${style}"><b>${d.n}</b><span>${t('l_taken')}</span></div>`;
    const mine = S.desk === d.n && S.mode === 'viewing';
    const label = mine ? t('l_mine') : t('l_free');
    return `<button type="button" class="p-desk ${mine ? 'mine' : 'free'}" data-desk="${d.n}" style="${style}" aria-label="${t('desk_n', { n: d.n })}, ${label}"><b>${d.n}</b><span>${label}</span></button>`;
  }).join('');
  $('plan').innerHTML = h;
  $('planLegend').innerHTML = `<li><span class="sw pfree"></span>${t('plan_free', { from: CONFIG.DESKS_FROM[S.lang] })}</li><li><span class="sw taken"></span>${t('l_taken')}</li><li><span class="sw win"></span>${t('plan_win')}</li>`;
}

/* ---------- slots ---------- */
const slotLen = () => S.mode === 'room' ? 60 : CONFIG.VIEW_MIN;
function rowMins() {
  const out = [];
  if (S.mode === 'room') { for (let m = CONFIG.DESK_HOURS[0] * 60; m < Math.max(CONFIG.ROOM_HOURS.weekday[1], CONFIG.ROOM_HOURS.weekend[1]) * 60; m += 60) out.push(m); }
  else { for (let m = CONFIG.VIEW_HOURS[0] * 60; m < CONFIG.VIEW_HOURS[1] * 60; m += CONFIG.VIEW_MIN) out.push(m); }
  return out;
}
function isTaken(s, e) { return S.bookings.some(b => b.s < e && b.e > s); }
function cellState(day, min) {
  const s = at(day, min), e = new Date(s.getTime() + slotLen() * 60000);
  const weekend = wd(day) >= 5;
  let open;
  if (S.mode === 'room') {
    if (!weekend && min >= CONFIG.DESK_HOURS[0] * 60 && min < CONFIG.DESK_HOURS[1] * 60) return 'desk';
    const [a, b] = weekend ? CONFIG.ROOM_HOURS.weekend : CONFIG.ROOM_HOURS.weekday;
    open = min >= a * 60 && min + 60 <= b * 60;
  } else {
    open = !weekend && min >= CONFIG.VIEW_HOURS[0] * 60 && min + CONFIG.VIEW_MIN <= CONFIG.VIEW_HOURS[1] * 60;
  }
  if (!open) return 'closed';
  if (s.getTime() < Date.now() + CONFIG.LEAD_HOURS * 3600000 || s >= horizonEnd()) return 'past';
  if (isTaken(s, e)) return 'taken';
  return 'free';
}
function freeHoursFrom(day, min) {
  let n = 0;
  while (n < CONFIG.ROOM_MAX && cellState(day, min + n * 60) === 'free') n++;
  return n;
}
function selRange() {
  if (!S.sel) return null;
  const len = S.mode === 'room' ? S.hours * 60 : CONFIG.VIEW_MIN;
  return { s: at(S.sel.day, S.sel.min), e: at(S.sel.day, S.sel.min + len), len };
}
function inSel(day, min) {
  const r = selRange(); if (!r) return false;
  const s = at(day, min);
  return s >= r.s && s < r.e;
}

/* ---------- render ---------- */
function renderLegend() {
  const items = [['free', t('l_free')], ['taken', t('l_taken')]];
  if (S.mode === 'room') items.push(['desk', t('l_desk')]);
  items.push(['sel', t('l_sel')]);
  $('legend').innerHTML = items.map(([c, l]) => `<li><span class="sw ${c}"></span>${l}</li>`).join('');
}
function weekLabel() {
  const a = monday(S.week), b = addDays(a, 6), m = T[S.lang].mShort;
  return a.getMonth() === b.getMonth()
    ? (S.lang === 'lt' ? `${m[a.getMonth()]} ${a.getDate()}-${b.getDate()}` : `${a.getDate()}-${b.getDate()} ${m[a.getMonth()]}`)
    : (S.lang === 'lt' ? `${m[a.getMonth()]} ${a.getDate()} - ${m[b.getMonth()]} ${b.getDate()}` : `${a.getDate()} ${m[a.getMonth()]} - ${b.getDate()} ${m[b.getMonth()]}`);
}
function render() {
  const mon = monday(S.week), today = startOfDay(new Date()).getTime();
  const days = [...Array(7)].map((_, i) => addDays(mon, i));
  const rows = rowMins();
  $('weekLabel').textContent = weekLabel();
  $('prevWeek').disabled = S.week <= 0;
  $('nextWeek').disabled = S.week >= CONFIG.WEEKS_AHEAD - 1;
  $('loading').hidden = S.loaded; $('loading').textContent = t('loading');

  // desktop grid
  let g = '<div></div>' + days.map(d => `<div class="dh${d.getTime() === today ? ' today' : ''}">${T[S.lang].days[wd(d)]}<b>${d.getDate()}</b></div>`).join('');
  rows.forEach((min, ri) => {
    g += `<div class="tl">${hm(min)}</div>`;
    days.forEach((d, di) => {
      const st = cellState(d, min);
      const sel = inSel(d, min);
      const cls = ['cell', st];
      let label = '';
      const kindAt = i => i < 0 || i >= rows.length ? null : (inSel(d, rows[i]) ? 'sel' : cellState(d, rows[i]));
      const k = sel ? 'sel' : st;
      if (k === 'desk' || k === 'taken' || k === 'sel') {
        cls.push('run');
        const first = kindAt(ri - 1) !== k, last = kindAt(ri + 1) !== k;
        if (first) cls.push('first');
        if (last) cls.push('last');
        if (first) label = k === 'desk' ? t('l_desk') : k === 'taken' ? t('l_taken') : hm(S.sel.min) + '-' + hm(S.sel.min + selRange().len);
      }
      if (sel) cls.push('sel');
      if (st === 'free' || sel) g += `<button type="button" class="${cls.join(' ')}" data-d="${di}" data-m="${min}" data-t="${hm(min)}" aria-label="${T[S.lang].daysLong[wd(d)]} ${hm(min)}">${label}</button>`;
      else g += `<div class="${cls.join(' ')}">${label}</div>`;
    });
  });
  $('grid').innerHTML = g;

  // phone day pills + slots
  if (S.day === null) {
    const first = days.findIndex(d => rows.some(m => cellState(d, m) === 'free'));
    S.day = first >= 0 ? first : Math.max(0, days.findIndex(d => d.getTime() >= today));
  }
  $('days').innerHTML = days.map((d, i) => {
    const has = rows.some(m => cellState(d, m) === 'free');
    return `<button type="button" data-i="${i}" aria-pressed="${i === S.day}">${T[S.lang].days[wd(d)]}<b>${d.getDate()}</b><span class="mark${has ? '' : ' none'}"></span></button>`;
  }).join('');
  const d = days[S.day];
  const states = rows.map(m => [m, cellState(d, m)]);
  let html = '';
  const deskRows = states.filter(([, st]) => st === 'desk');
  if (deskRows.length) html += `<div class="slot desk"><span class="t">${hm(deskRows[0][0])}-${hm(deskRows[deskRows.length - 1][0] + 60)}</span><span>${t('desk_block')}</span></div>`;
  states.filter(([, st]) => st === 'free' || st === 'taken').forEach(([m, st]) => {
    const sel = inSel(d, m);
    const right = sel ? t('l_sel') : st === 'taken' ? t('l_taken') : t('l_free');
    html += st === 'free'
      ? `<button type="button" class="slot${sel ? ' sel' : ''}" data-d="${S.day}" data-m="${m}"><span class="t">${hm(m)}</span><span>${right}</span></button>`
      : `<div class="slot taken"><span class="t">${hm(m)}</span><span>${right}</span></div>`;
  });
  if (!states.some(([, st]) => st === 'free' || st === 'taken')) {
    const weekend = wd(d) >= 5;
    html += `<p class="empty-day">${S.mode === 'viewing' && weekend ? t('no_view') : states.some(([, st]) => st === 'past') ? t('no_left') : t('no_room')}</p>`;
  }
  $('slots').innerHTML = html;
  renderCard();
}

function renderCard() {
  const r = selRange(), room = S.mode === 'room';
  $('cPrice').textContent = '€' + (room ? CONFIG.ROOM_PRICE : CONFIG.DESK_PRICE);
  $('cUnit').textContent = room ? t('per_hour') : t('per_month');
  $('cSub').textContent = room ? t('c_room_sub', { n: CONFIG.ROOM_LONG_FROM, p: CONFIG.ROOM_PRICE_LONG }) : S.desk ? t('c_view_sub_desk', { n: S.desk }) : t('c_view_sub');
  let total = 0;
  if (r && room) total = S.hours * (S.hours >= CONFIG.ROOM_LONG_FROM ? CONFIG.ROOM_PRICE_LONG : CONFIG.ROOM_PRICE);
  updateBar(total);
  const done = !$('pDone').hidden;
  $('cMain').hidden = done;

  $('cDay').textContent = r ? shortDay(S.sel.day) : t('c_pick');

  $('cDetails').hidden = !r;

  $('cLines').hidden = !r;

    $('totR').textContent = '€' + total;

  $('cNote').textContent = r ? (room ? t('c_note_room') : t('c_note_view')) : (room ? t('c_hint_room') : t('c_hint_view'));
}
function updateBar(total) {
  const r = selRange(), room = S.mode === 'room';
  if (r) {
    $('mbPrice').textContent = room ? '€' + total : t('free_price');
    $('mbSub').textContent = shortDay(S.sel.day) + ', ' + hm(S.sel.min) + '-' + hm(S.sel.min + r.len);
  } else {
    $('mbPrice').textContent = '€' + (room ? CONFIG.ROOM_PRICE : CONFIG.DESK_PRICE) + ' ' + (room ? t('per_hour') : t('per_month'));
    $('mbSub').textContent = room ? t('mb_room') : t('mb_view');
  }
  $('mbBtn').textContent = r ? (room ? t('btn_reserve') : t('btn_view_reserve')) : t('btn_pick');
}
function renderPurpose() {
  $('purposeChips').innerHTML = PURPOSES.map(([k, ic]) =>

/* ---------- interactions ---------- */
const goTo = el => el.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
function pick(di, min) {
  const day = addDays(monday(S.week), di);
  $('pErr').textContent = '';
  hideDone();
  if (S.mode === 'room') {
    const n = freeHoursFrom(day, min);
    if (n < CONFIG.ROOM_MIN) {
      S.sel = null; render();
      $('pErr').textContent = t('err_short', { n, m: CONFIG.ROOM_MIN });
      const c = document.querySelector(`.cell[data-d="${di}"][data-m="${min}"], .slot[data-d="${di}"][data-m="${min}"]`);
      if (c) { c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
      return;
    }
    S.hours = Math.min(Math.max(S.hours, CONFIG.ROOM_MIN), n);
  }
  S.sel = { day, min };
  render();
}
function setMode(m) {
  if (S.mode === m) return;
  S.mode = m; S.sel = null; S.day = null; hideDone(); $('pErr').textContent = '';
  if (m === 'room') S.desk = null;
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  markTabs(); renderPlan(); renderLegend(); render();
}
function hideDone() { $('pDone').hidden = true; }

document.addEventListener('click', e => {
  const c = e.target.closest('.cell[data-d], .slot[data-d]');
  if (c) return pick(+c.dataset.d, +c.dataset.m);
  const pd = e.target.closest('.p-desk[data-desk]');
  if (pd) { S.desk = +pd.dataset.desk; setMode('viewing'); renderPlan(); renderCard(); return goTo($('rezervacija')); }

  if (dp) { S.day = +dp.dataset.i; return render(); }
  const go = e.target.closest('[data-go]');

  const md = e.target.closest('[data-mode]');
  if (md) return setMode(md.dataset.mode);
  const lb = e.target.closest('.lang button');
  if (lb) { S.lang = lb.dataset.lang; store.set('k9-lang', S.lang); applyLang(); }
});

/* ---------- data: demo or Apps Script ---------- */
function demoSeed() {
  // example bookings so the demo looks lived in: (week, weekday 0=Mon, hour, hours, kind)
  const out = [], today = startOfDay(new Date());
  const mk = (w, wday, h, len, kind) => {
    const day = addDays(today, w * 7 + ((wday - wd(today) + 7) % 7));
    out.push({ s: at(day, h * 60).getTime(), e: at(day, h * 60 + len * 60).getTime(), kind });
  };
  mk(0, 1, 19, 2, 'room'); mk(0, 3, 18, 3, 'room'); mk(0, 5, 12, 4, 'room'); mk(0, 6, 10, 3, 'room'); mk(0, 2, 15, .5, 'viewing'); mk(0, 3, 11.5, .5, 'viewing');
  mk(1, 0, 19, 3, 'room'); mk(1, 4, 18, 4, 'room'); mk(1, 5, 14, 4, 'room'); mk(1, 6, 16, 2, 'room'); mk(1, 1, 16, .5, 'viewing');
  mk(2, 3, 18, 4, 'room'); mk(2, 5, 10, 6, 'room');
  return out;
}
async function load() {
  S.loaded = false; render();
  try {
    if (DEMO) {
      await new Promise(r => setTimeout(r, 350));
      S.bookings = demoSeed().concat(store.get('k9-demo') || []);
    } else {
      const from = monday(0).toISOString(), to = horizonEnd().toISOString();
      const res = await fetch(`${CONFIG.API_URL}?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
      const j = await res.json();
      S.bookings = (j.bookings || []).map(b => ({ s: Date.parse(b.start), e: Date.parse(b.end), kind: b.kind }));
    }
  } catch (err) { /* keep what we have; the grid still renders */ }
  S.loaded = true; render();
}
async function send(payload) {
  if (DEMO) {
    await new Promise(r => setTimeout(r, 500));
    if (payload.kind !== 'interest') {
      const s = Date.parse(payload.start), e = Date.parse(payload.end);
      if (isTaken(s, e)) return { ok: false, error: 'taken' };
      const mine = store.get('k9-demo') || []; mine.push({ s, e, kind: payload.kind }); store.set('k9-demo', mine);
    }
    return { ok: true };
  }
  const res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(payload) });
  return res.json();
}

$('pForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (S.busy) return;
  if (!S.sel) return goTo($("rezervacija"));
  const name = $('fName').value.trim(), phone = $('fPhone').value.trim(), email = $('fEmail').value.trim();
  $('fName').setAttribute('aria-invalid', String(!name));
  const noContact = !phone && !/^\S+@\S+\.\S+$/.test(email);
  $('fPhone').setAttribute('aria-invalid', String(noContact)); $('fEmail').setAttribute('aria-invalid', String(noContact));
  if (!name) { $('pErr').textContent = t('err_name'); return $('fName').focus(); }
  if (noContact) { $('pErr').textContent = t('err_contact'); return $('fPhone').focus(); }
  const r = selRange();
  const payload = {
    kind: S.mode, start: r.s.toISOString(), end: r.e.toISOString(),
    purpose: S.mode === 'room' ? S.purpose : (S.desk ? 'stalas ' + S.desk : ''), name, phone, email, lang: S.lang, website: $('fWeb').value,
  };
  S.busy = true; $('pErr').textContent = ''; renderCard();
  let res;
  try { res = await send(payload); } catch (err) { res = { ok: false, error: 'net' }; }
  S.busy = false;
  if (res && res.ok) {
    S.bookings.push({ s: r.s.getTime(), e: r.e.getTime(), kind: S.mode });
    const wasRoom = S.mode === 'room';
    S.sel = null;
    $('pDone').hidden = false;
    $('pDoneH').textContent = wasRoom ? t('ok_room_h') : t('ok_view_h');
    $('pDoneP').textContent = wasRoom ? t('ok_room') : t('ok_view');
    render();
  } else {
    $('pErr').textContent = res && res.error === 'taken' ? t('err_taken') : t('err_net');
    if (res && res.error === 'taken') { await load(); S.sel = null; render(); $('pErr').textContent = t('err_taken'); }
    else renderCard();
  }
});

$('evForm').addEventListener('submit', async e => {
  e.preventDefault();
  const picks = [...document.querySelectorAll('input[name="interest"]:checked')].map(i => i.value);
  const contact = $('evContact').value.trim();
  $('evOk').hidden = true;
  if (!picks.length) { $('evErr').textContent = t('ev_pick'); return; }
  if (contact.length < 5) { $('evErr').textContent = t('ev_need'); return $('evContact').focus(); }
  $('evErr').textContent = '';
  try {
    const res = await send({ kind: 'interest', interests: picks, contact, lang: S.lang, website: $('evWeb').value });
    if (res && res.ok) { $('evOk').hidden = false; e.target.reset(); } else $('evErr').textContent = t('err_net');
  } catch (err) { $('evErr').textContent = t('err_net'); }
});

markTabs();
applyLang();
load();
if (!DEMO) setInterval(() => { if (!S.busy) load(); }, 60000);
</script>
</body>
</html>
